<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Memory Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="light-mode">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i data-lucide="brain-circuit" class="logo-icon"></i>
                    <span>Paper Memory</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="overview">
                    <i data-lucide="layout-dashboard"></i>
                    <span data-i18n="nav.overview">概要</span>
                </a>
                <a href="#" class="nav-item" data-view="notes">
                    <i data-lucide="sticky-note"></i>
                    <span data-i18n="nav.notes">知識ノート</span>
                </a>
                <a href="#" class="nav-item" data-view="upload">
                    <i data-lucide="upload-cloud"></i>
                    <span data-i18n="nav.upload">PDFアップロード</span>
                </a>
                <a href="#" class="nav-item" data-view="papers">
                    <i data-lucide="book-open"></i>
                    <span data-i18n="nav.papers">登録論文</span>
                </a>
                <a href="#" class="nav-item" data-view="references">
                    <i data-lucide="library"></i>
                    <span data-i18n="nav.references">参考文献</span>
                </a>
                <a href="#" class="nav-item" data-view="search">
                    <i data-lucide="search"></i>
                    <span data-i18n="nav.search">セマンティック検索</span>
                </a>
                <a href="#" class="nav-item" data-view="qa">
                    <i data-lucide="bot"></i>
                    <span data-i18n="nav.qa">AIアシスタント</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="theme-btn">
                    <i data-lucide="sun" class="sun-icon"></i>
                    <i data-lucide="moon" class="moon-icon"></i>
                    <span data-i18n="nav.theme">テーマ切替</span>
                </button>
                <div class="lang-selector-container">
                    <i data-lucide="languages" class="lang-icon"></i>
                    <select id="lang-selector" class="lang-select">
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h1 id="view-title" data-i18n="nav.overview">概要</h1>
                <div class="user-actions">
                    <div class="status-badge" id="connection-status">
                        <span class="status-dot"></span>
                        <span id="server-status">Connected</span>
                    </div>
                </div>
            </header>

            <div id="content-area" class="content-area">
                <!-- Content will be injected here by app.js -->
                <div class="loader-container">
                    <div class="loader"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Templates -->
    <template id="tpl-overview">
        <div class="overview-grid">
            <div class="stat-card" data-goto="notes">
                <div class="stat-icon note-color"><i data-lucide="file-text"></i></div>
                <div class="stat-info">
                    <span class="stat-label" data-i18n="stat.total_notes">総ノート数</span>
                    <span class="stat-value" id="stat-total-notes">-</span>
                </div>
            </div>
            <div class="stat-card" data-goto="papers">
                <div class="stat-icon paper-color"><i data-lucide="book"></i></div>
                <div class="stat-info">
                    <span class="stat-label" data-i18n="stat.total_papers">登録論文数</span>
                    <span class="stat-value" id="stat-total-papers">-</span>
                </div>
            </div>
            <div class="stat-card" data-goto="search">
                <div class="stat-icon link-color"><i data-lucide="share-2"></i></div>
                <div class="stat-info">
                    <span class="stat-label" data-i18n="stat.total_links">知識リンク数</span>
                    <span class="stat-value" id="stat-total-links">-</span>
                </div>
            </div>
            <div class="stat-card" data-goto="references">
                <div class="stat-icon ref-color"><i data-lucide="bookmark"></i></div>
                <div class="stat-info">
                    <span class="stat-label" data-i18n="stat.unread_refs">未読参考文献</span>
                    <span class="stat-value" id="stat-total-refs">-</span>
                </div>
            </div>
        </div>

        <div class="dashboard-sections">
            <section class="dashboard-section chart-section">
                <h3><i data-lucide="pie-chart"></i> <span data-i18n="section.distribution">知識分布</span></h3>
                <div id="type-distribution" class="type-tags"></div>
            </section>
            <section class="dashboard-section recent-section">
                <h3><i data-lucide="clock"></i> <span data-i18n="section.recent">最近追加された知識</span></h3>
                <div id="recent-notes" class="mini-note-list"></div>
            </section>
        </div>
    </template>

    <div id="note-modal" class="modal">
        <div class="modal-content">
            <header class="modal-header">
                <span id="modal-type" class="note-type">TYPE</span>
                <button class="modal-close"><i data-lucide="x"></i></button>
            </header>
            <div id="modal-body">
                <h2 id="modal-paper-title">Paper Title</h2>
                <div id="modal-paper-doi" style="margin-bottom: 24px; font-size: 0.85rem; opacity: 0.8;"></div>
                <div id="modal-content-full" class="modal-text-block"></div>
                
                <div class="modal-meta-grid">
                    <div class="modal-meta-section">
                        <h4><i data-lucide="key"></i> <span data-i18n="modal.keywords">キーワード</span></h4>
                        <div id="modal-keywords" class="keyword-tags"></div>
                    </div>
                    <div class="modal-meta-section">
                        <h4><i data-lucide="message-square"></i> <span data-i18n="modal.context">文脈・前提</span></h4>
                        <div id="modal-context" class="modal-text-small"></div>
                    </div>
                </div>

                <div class="modal-links-section">
                    <h4><i data-lucide="share-2"></i> <span data-i18n="modal.links">関連ノート</span></h4>
                    <div id="modal-links" class="mini-note-list horizontal"></div>
                </div>

                <div id="modal-actions" class="modal-actions" style="display:none; margin-top:32px; padding-top:24px; border-top:1px solid var(--border); display:flex; gap:12px; justify-content: flex-end;">
                    <button id="btn-dismiss-ref" class="action-btn dismiss">
                        <i data-lucide="trash-2"></i> <span data-i18n="modal.dismiss">参考文献から除外</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PDF ドラッグ&ドロップ オーバーレイ -->
    <div id="drop-overlay" class="drop-overlay">
        <div class="drop-overlay-content">
            <i data-lucide="file-up" class="drop-icon"></i>
            <p data-i18n="analysis.drop_pdf">PDFファイルをドロップして解析を開始</p>
        </div>
    </div>

    <!-- 解析プログレスモーダル -->
    <div id="analysis-modal" class="modal analysis-modal">
        <div class="modal-content analysis-modal-content">
            <header class="modal-header">
                <span class="note-type">📄 <span data-i18n="nav.papers">登録論文</span></span>
                <button class="modal-close analysis-modal-close"><i data-lucide="x"></i></button>
            </header>
            <div class="analysis-modal-body">
                <h2 id="analysis-title" data-i18n="analysis.title">論文を解析中...</h2>
                <div class="analysis-progress-container">
                    <div class="analysis-steps">
                        <div class="analysis-step" data-step="uploading">
                            <div class="step-indicator"><i data-lucide="upload"></i></div>
                            <span data-i18n="analysis.uploading">アップロード</span>
                        </div>
                        <div class="analysis-step" data-step="extracting_init">
                            <div class="step-indicator"><i data-lucide="loader"></i></div>
                            <span data-i18n="analysis.extracting_init">初期化</span>
                        </div>
                        <div class="analysis-step" data-step="extracting_convert">
                            <div class="step-indicator"><i data-lucide="file-search"></i></div>
                            <span data-i18n="analysis.extracting_convert">PDF解析</span>
                        </div>
                        <div class="analysis-step" data-step="extracting_images">
                            <div class="step-indicator"><i data-lucide="image"></i></div>
                            <span data-i18n="analysis.extracting_images">画像処理</span>
                        </div>
                        <div class="analysis-step" data-step="extracting_markdown">
                            <div class="step-indicator"><i data-lucide="file-text"></i></div>
                            <span data-i18n="analysis.extracting_markdown">Markdown生成</span>
                        </div>
                        <div class="analysis-step" data-step="turn_1">
                            <div class="step-indicator"><i data-lucide="brain"></i></div>
                            <span data-i18n="analysis.turn_1">AI解析 (1/3)</span>
                        </div>
                        <div class="analysis-step" data-step="turn_2">
                            <div class="step-indicator"><i data-lucide="brain"></i></div>
                            <span data-i18n="analysis.turn_2">AI解析 (2/3)</span>
                        </div>
                        <div class="analysis-step" data-step="turn_3">
                            <div class="step-indicator"><i data-lucide="brain"></i></div>
                            <span data-i18n="analysis.turn_3">AI解析 (3/3)</span>
                        </div>
                        <div class="analysis-step" data-step="registering">
                            <div class="step-indicator"><i data-lucide="database"></i></div>
                            <span data-i18n="analysis.registering">DB登録</span>
                        </div>
                    </div>
                    <div class="analysis-progress-bar">
                        <div id="analysis-progress-fill" class="analysis-progress-fill"></div>
                    </div>
                </div>
                <p id="analysis-status-text" class="analysis-status-text" data-i18n="analysis.preparing">準備中...</p>
                <div id="analysis-result" class="analysis-result" style="display:none;"></div>
                <div id="analysis-error" class="analysis-error" style="display:none;"></div>
            </div>
        </div>
    </div>

    <!-- 確認ダイアログ -->
    <div id="confirm-dialog" class="modal confirm-dialog">
        <div class="modal-content confirm-dialog-content">
            <header class="modal-header">
                <span class="note-type">⚠️ <span data-i18n="analysis.confirm">確認</span></span>
            </header>
            <div class="confirm-dialog-body">
                <p id="confirm-dialog-message"></p>
                <div class="confirm-dialog-actions"></div>
            </div>
        </div>
    </div>


    <template id="tpl-upload">
        <div class="upload-view">
            <div id="upload-config-panel" class="upload-config-panel" style="margin-bottom: 20px; padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; display: none; gap: 20px; align-items: center; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label for="pdf-backend-select" style="font-weight: 500; font-size: 0.9rem;" data-i18n="upload.backend_label">PDF抽出エンジン:</label>
                    <select id="pdf-backend-select" class="lang-select" style="padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-main); color: var(--fg-main);">
                        <option value="auto" data-i18n="upload.backend_auto">自動 (Docling -> 失敗時Marker)</option>
                        <option value="docling" data-i18n="upload.backend_docling">Docling (デフォルト)</option>
                        <option value="marker" data-i18n="upload.backend_marker">Marker (marker-pdf)</option>
                    </select>
                </div>
                <div id="pdf-light-mode-container" style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem;">
                    <input type="checkbox" id="pdf-light-mode-checkbox">
                    <label for="pdf-light-mode-checkbox" data-i18n="upload.light_mode_label">軽量モード (Marker用: CPU/OCRなし)</label>
                </div>
            </div>

            <div id="upload-dropzone" class="upload-dropzone">
                <i data-lucide="upload-cloud" class="upload-icon"></i>
                <h3 data-i18n="upload.dropzone_title">PDFをここにドロップ</h3>
                <p data-i18n="upload.dropzone_desc">またはクリックしてファイルを選択</p>
                <input type="file" id="upload-file-input" accept="application/pdf" style="display: none;">
            </div>

            <div class="queue-section">
                <h3 data-i18n="upload.queue_title">処理待ちキュー (Markdown抽出済み)</h3>
                <div id="queue-list" class="queue-list">
                    <!-- Queue items will be injected here -->
                </div>
            </div>
        </div>
    </template>

    <script src="i18n.js?v=3"></script>
    <script src="app.js?v=5"></script>
</body>
</html>
